# OrbStack:  HOST_PORT=6800 docker compose up --build -d   ->  http://127.0.0.1:6800
# The server binds 0.0.0.0 INSIDE the container (MEL_LAB_BIND is the opt-in), but the port is published on loopback only.
# Do not change the 127.0.0.1 below. HOST_PORT must stay in 6800-6849.
# Nothing else is needed: the lab is self-contained and makes no outbound call at all.
name: mcp-elicitation-lab

services:
  mcp-elicitation-lab:
    build: .
    ports:
      - "127.0.0.1:${HOST_PORT:-6800}:6800"
    environment:
      SHELF_URL: ${SHELF_URL:-http://127.0.0.1:4400}
      PORT: "6800"
      MEL_LAB_BIND: 0.0.0.0
      # Names besides loopback the lab answers to (as <name>:6800). The default is the Host the family lab-proxy sends.
      LAB_ALLOWED_HOSTS: ${LAB_ALLOWED_HOSTS:-mcp-elicitation-lab.local.ping-devops.com}
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:6800/api/health').then(r=>r.json()).then(j=>process.exit(j.schema==='demo-health/1'&&j.state==='ready'?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      start_period: 5s
      start_interval: 2s
      timeout: 5s
      retries: 3
